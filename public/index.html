<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Remote Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      background: #161b22;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }
    .top-bar h1 { font-size: 16px; color: #58a6ff; }
    .top-bar input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Consolas', monospace;
      letter-spacing: 3px;
      width: 140px;
      text-align: center;
      text-transform: uppercase;
    }
    .top-bar input::placeholder { color: #484f58; letter-spacing: 1px; font-size: 13px; }
    .top-bar button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .top-bar button:hover { background: #2ea043; }
    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.off { background: #da3633; color: #fff; }
    .status.waiting { background: #d29922; color: #000; }
    .status.on { background: #238636; color: #fff; }
    .info { margin-left: auto; font-size: 12px; color: #484f58; }

    /* Screen View */
    #screen-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    #screen-img {
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      image-rendering: auto;
    }
    #placeholder {
      text-align: center;
      color: #484f58;
    }
    #placeholder .icon { font-size: 64px; margin-bottom: 10px; }
    #placeholder p { font-size: 14px; }

    /* Click effect */
    .click-ring {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #58a6ff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: ring 0.5s ease-out forwards;
    }
    @keyframes ring {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* FPS counter */
    #fps {
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      color: #3fb950;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🎮 Remote Control</h1>
    <input type="text" id="room-input" placeholder="ROOM ID" maxlength="6">
    <button id="btn-connect">Kết nối</button>
    <span class="status off" id="status">Chưa kết nối</span>
    <span class="info" id="frame-info"></span>
  </div>

  <div id="screen-container">
    <div id="placeholder">
      <div class="icon">🖥️</div>
      <p>Nhập Room ID và nhấn Kết nối</p>
      <p style="margin-top:5px; font-size:12px;">Sau đó bạn sẽ thấy màn hình máy Host ở đây</p>
    </div>
    <img id="screen-img" style="display:none;" alt="Remote Screen">
    <div id="fps"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    const roomInput = document.getElementById("room-input");
    const btnConnect = document.getElementById("btn-connect");
    const statusEl = document.getElementById("status");
    const screenImg = document.getElementById("screen-img");
    const placeholder = document.getElementById("placeholder");
    const fpsEl = document.getElementById("fps");
    const frameInfo = document.getElementById("frame-info");
    const screenContainer = document.getElementById("screen-container");

    let socket = null;
    let roomId = null;
    let frameCount = 0;
    let lastFpsTime = Date.now();

    // Get server URL (same origin when deployed, localhost for dev)
    const SERVER_URL = window.location.origin;

    // ===== CONNECT =====
    btnConnect.addEventListener("click", connect);
    roomInput.addEventListener("keypress", (e) => { if (e.key === "Enter") connect(); });

    function connect() {
      roomId = roomInput.value.trim().toUpperCase();
      if (!roomId || roomId.length < 4) {
        alert("Nhập Room ID hợp lệ (ít nhất 4 ký tự)!");
        return;
      }

      setStatus("waiting", "Đang kết nối...");

      socket = io(SERVER_URL, {
        transports: ["websocket", "polling"],
        reconnection: true,
      });

      socket.on("connect", () => {
        console.log("[Socket] Connected:", socket.id);
        socket.emit("join-room", roomId);
      });

      socket.on("room-joined", () => {
        console.log("[Room] Joined:", roomId);
        setStatus("on", "🟢 Đã kết nối");
      });

      socket.on("error-msg", (msg) => {
        setStatus("off", msg);
        alert("Lỗi: " + msg);
      });

      // ===== RECEIVE SCREEN FRAMES =====
      socket.on("screen-frame", (frameBase64) => {
        screenImg.src = "data:image/jpeg;base64," + frameBase64;
        screenImg.style.display = "block";
        placeholder.style.display = "none";

        // FPS counter
        frameCount++;
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
          fpsEl.textContent = frameCount + " FPS";
          const sizeKB = Math.round(frameBase64.length * 0.75 / 1024);
          frameInfo.textContent = `Frame: ${sizeKB} KB`;
          frameCount = 0;
          lastFpsTime = now;
        }
      });

      socket.on("host-disconnected", () => {
        setStatus("off", "Host ngắt kết nối");
        screenImg.style.display = "none";
        placeholder.style.display = "block";
      });

      socket.on("disconnect", () => {
        setStatus("off", "Mất kết nối");
      });
    }

    function setStatus(type, text) {
      statusEl.className = "status " + type;
      statusEl.textContent = text;
    }

    // ===== CLICK HANDLER =====
    screenImg.addEventListener("click", (e) => {
      if (!socket || !socket.connected) return;

      const rect = screenImg.getBoundingClientRect();
      // Tính tỷ lệ click so với ảnh thật
      const scaleX = screenImg.naturalWidth / rect.width;
      const scaleY = screenImg.naturalHeight / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      // Gửi tọa độ (tương đối với màn hình gốc, server sẽ tính lại)
      socket.emit("mouse-action", {
        roomId,
        action: {
          type: "click",
          // Gửi tỷ lệ 0-1 để Host tự tính theo resolution thật
          x: (e.clientX - rect.left) / rect.width,
          y: (e.clientY - rect.top) / rect.height,
        },
      });

      // Visual feedback
      showClickRing(e.clientX, e.clientY);
    });

    screenImg.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (!socket || !socket.connected) return;

      const rect = screenImg.getBoundingClientRect();
      socket.emit("mouse-action", {
        roomId,
        action: {
          type: "rightclick",
          x: (e.clientX - rect.left) / rect.width,
          y: (e.clientY - rect.top) / rect.height,
        },
      });
      showClickRing(e.clientX, e.clientY);
    });

    function showClickRing(clientX, clientY) {
      const ring = document.createElement("div");
      ring.className = "click-ring";
      ring.style.left = clientX + "px";
      ring.style.top = clientY + "px";
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 500);
    }
  </script>
</body>
</html>
