<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Remote Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #161b22;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }
    .top-bar h1 { font-size: 16px; color: #58a6ff; }
    .top-bar input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Consolas', monospace;
      letter-spacing: 3px;
      width: 140px;
      text-align: center;
      text-transform: uppercase;
    }
    .top-bar input::placeholder { color: #484f58; letter-spacing: 1px; font-size: 13px; }
    .top-bar button {
      background: #238636; color: #fff; border: none;
      padding: 6px 18px; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: background 0.2s;
    }
    .top-bar button:hover { background: #2ea043; }
    .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status.off { background: #da3633; color: #fff; }
    .status.waiting { background: #d29922; color: #000; }
    .status.on { background: #238636; color: #fff; }
    .info { margin-left: auto; font-size: 12px; color: #8b949e; font-family: monospace; }

    #screen-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Video player thay thế img */
    #screen-video {
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
    }
    /* Fallback img cho MJPEG */
    #screen-img {
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      display: none;
    }
    #placeholder { text-align: center; color: #484f58; }
    #placeholder .icon { font-size: 64px; margin-bottom: 10px; }
    #placeholder p { font-size: 14px; }

    .click-ring {
      position: absolute; width: 24px; height: 24px;
      border: 2px solid #58a6ff; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%);
      animation: ring 0.5s ease-out forwards;
    }
    @keyframes ring {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    #fps {
      position: absolute; top: 8px; right: 12px;
      background: rgba(0,0,0,0.7); color: #3fb950;
      padding: 3px 8px; border-radius: 4px;
      font-family: monospace; font-size: 12px; z-index: 5;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🎮 Remote Control</h1>
    <input type="text" id="room-input" placeholder="ROOM ID" maxlength="6">
    <button id="btn-connect">Kết nối</button>
    <span class="status off" id="status">Chưa kết nối</span>
    <span class="info" id="frame-info"></span>
  </div>

  <div id="screen-container">
    <div id="placeholder">
      <div class="icon">🖥️</div>
      <p>Nhập Room ID và nhấn Kết nối</p>
      <p style="margin-top:5px; font-size:12px;">Sau đó bạn sẽ thấy màn hình máy Host ở đây</p>
    </div>
    <video id="screen-video" style="display:none;" autoplay muted playsinline></video>
    <img id="screen-img" alt="Remote Screen">
    <div id="fps"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    const roomInput = document.getElementById("room-input");
    const btnConnect = document.getElementById("btn-connect");
    const statusEl = document.getElementById("status");
    const screenVideo = document.getElementById("screen-video");
    const screenImg = document.getElementById("screen-img");
    const placeholder = document.getElementById("placeholder");
    const fpsEl = document.getElementById("fps");
    const frameInfo = document.getElementById("frame-info");
    const screenContainer = document.getElementById("screen-container");

    let socket = null;
    let roomId = null;
    let segmentCount = 0;
    let lastFpsTime = Date.now();
    let totalBytes = 0;

    // ===== MSE H.264 Player =====
    let mediaSource = null;
    let sourceBuffer = null;
    let appendQueue = [];
    let isH264Mode = false;

    function initMSE() {
      if (!window.MediaSource) {
        console.warn("[MSE] Not supported, falling back to MJPEG");
        return false;
      }

      mediaSource = new MediaSource();
      screenVideo.src = URL.createObjectURL(mediaSource);

      mediaSource.addEventListener("sourceopen", () => {
        console.log("[MSE] Source opened");
        try {
          // H.264 Baseline Profile Level 3.1
          sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01F"');
          sourceBuffer.mode = "segments";

          sourceBuffer.addEventListener("updateend", () => {
            // Append queued data
            if (appendQueue.length > 0 && !sourceBuffer.updating) {
              const next = appendQueue.shift();
              try { sourceBuffer.appendBuffer(next); } catch(e) {}
            }

            // Trim old buffer to prevent memory growth (keep last 5 seconds)
            try {
              if (screenVideo.buffered.length > 0) {
                const end = screenVideo.buffered.end(screenVideo.buffered.length - 1);
                const start = screenVideo.buffered.start(0);
                if (end - start > 8) {
                  sourceBuffer.remove(start, end - 5);
                }
              }
            } catch(e) {}
          });

          sourceBuffer.addEventListener("error", (e) => {
            console.error("[MSE] SourceBuffer error:", e);
          });

        } catch(e) {
          console.error("[MSE] addSourceBuffer failed:", e.message);
          return;
        }
      });

      mediaSource.addEventListener("sourceended", () => console.log("[MSE] Source ended"));
      mediaSource.addEventListener("sourceclose", () => console.log("[MSE] Source closed"));

      return true;
    }

    function appendToMSE(data) {
      if (!sourceBuffer) return;

      const uint8 = data instanceof Uint8Array ? data : new Uint8Array(data);

      if (sourceBuffer.updating || appendQueue.length > 0) {
        // Drop frames if queue is too long (prevent memory buildup)
        if (appendQueue.length > 30) {
          appendQueue.splice(0, appendQueue.length - 10); // Keep last 10
        }
        appendQueue.push(uint8);
      } else {
        try {
          sourceBuffer.appendBuffer(uint8);
        } catch(e) {
          console.error("[MSE] append error:", e.message);
        }
      }

      // Keep video at live edge (prevent growing delay)
      if (screenVideo.buffered.length > 0) {
        const liveEdge = screenVideo.buffered.end(screenVideo.buffered.length - 1);
        if (liveEdge - screenVideo.currentTime > 1.5) {
          screenVideo.currentTime = liveEdge - 0.3;
        }
      }
    }

    // ===== CONNECT =====
    const SERVER_URL = window.location.origin;
    btnConnect.addEventListener("click", connect);
    roomInput.addEventListener("keypress", (e) => { if (e.key === "Enter") connect(); });

    function connect() {
      roomId = roomInput.value.trim().toUpperCase();
      if (!roomId || roomId.length < 4) {
        alert("Nhập Room ID hợp lệ (ít nhất 4 ký tự)!");
        return;
      }

      setStatus("waiting", "Đang kết nối...");

      // Reset MSE
      if (mediaSource) {
        try { URL.revokeObjectURL(screenVideo.src); } catch(e) {}
      }
      appendQueue = [];
      segmentCount = 0;
      totalBytes = 0;
      isH264Mode = false;

      socket = io(SERVER_URL, {
        transports: ["websocket", "polling"],
        reconnection: true,
      });

      socket.on("connect", () => {
        console.log("[Socket] Connected:", socket.id);
        socket.emit("join-room", roomId);
      });

      socket.on("room-joined", () => {
        setStatus("on", "🟢 Đã kết nối");
      });

      socket.on("error-msg", (msg) => {
        setStatus("off", msg);
      });

      // ===== H.264 MODE: Init segment =====
      socket.on("stream-init", (initData) => {
        console.log("[H.264] Init segment received:", initData.byteLength || initData.length, "bytes");
        isH264Mode = true;

        // Show video, hide img
        screenVideo.style.display = "block";
        screenImg.style.display = "none";
        placeholder.style.display = "none";

        // Setup MSE
        initMSE();

        // Wait for MSE to be ready, then append init segment
        const checkReady = setInterval(() => {
          if (sourceBuffer && !sourceBuffer.updating) {
            clearInterval(checkReady);
            try {
              const data = initData instanceof Uint8Array ? initData :
                           initData instanceof ArrayBuffer ? new Uint8Array(initData) :
                           new Uint8Array(initData.buffer || initData);
              sourceBuffer.appendBuffer(data);
              console.log("[H.264] Init segment appended to MSE");
              screenVideo.play().catch(() => {});
            } catch(e) {
              console.error("[H.264] Init append error:", e.message);
            }
          }
        }, 50);
      });

      // ===== H.264 MODE: Media segments =====
      socket.on("stream-data", (segmentData) => {
        if (!isH264Mode) return;

        const data = segmentData instanceof Uint8Array ? segmentData :
                     segmentData instanceof ArrayBuffer ? new Uint8Array(segmentData) :
                     new Uint8Array(segmentData.buffer || segmentData);

        appendToMSE(data);
        segmentCount++;
        totalBytes += data.byteLength;

        // FPS & stats counter
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
          const fps = segmentCount;
          const bw = Math.round(totalBytes / 1024);
          fpsEl.textContent = fps + " FPS";
          frameInfo.textContent = `${bw} KB/s`;
          segmentCount = 0;
          totalBytes = 0;
          lastFpsTime = now;
        }
      });

      // ===== LEGACY MJPEG MODE =====
      let lastBlobUrl = null;
      socket.on("screen-frame", (frameData) => {
        if (isH264Mode) return; // Ignore if H.264 active

        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        if (frameData instanceof ArrayBuffer || frameData instanceof Uint8Array) {
          const blob = new Blob([frameData], { type: "image/jpeg" });
          lastBlobUrl = URL.createObjectURL(blob);
          screenImg.src = lastBlobUrl;
        } else if (typeof frameData === "string") {
          screenImg.src = "data:image/jpeg;base64," + frameData;
          lastBlobUrl = null;
        }
        screenImg.style.display = "block";
        screenVideo.style.display = "none";
        placeholder.style.display = "none";
      });

      socket.on("host-disconnected", () => {
        setStatus("off", "Host ngắt kết nối");
        screenVideo.style.display = "none";
        screenImg.style.display = "none";
        placeholder.style.display = "block";
      });

      socket.on("disconnect", () => setStatus("off", "Mất kết nối"));
    }

    function setStatus(type, text) {
      statusEl.className = "status " + type;
      statusEl.textContent = text;
    }

    // ===== CLICK HANDLER =====
    function handleClick(e, type) {
      if (!socket || !socket.connected) return;
      const target = isH264Mode ? screenVideo : screenImg;

      const rect = target.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;

      console.log(`[Click] ${type} at (${x.toFixed(3)}, ${y.toFixed(3)}) → sending to host`);
      socket.emit("mouse-action", { roomId, action: { type, x, y } });
      showClickRing(e.clientX, e.clientY);
    }

    // Click handler trực tiếp trên video
    screenVideo.addEventListener("click", (e) => {
      e.preventDefault();
      handleClick(e, "click");
    });
    screenVideo.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      handleClick(e, "rightclick");
    });

    // Click handler trên img (fallback MJPEG)
    screenImg.addEventListener("click", (e) => {
      e.preventDefault();
      handleClick(e, "click");
    });
    screenImg.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      handleClick(e, "rightclick");
    });

    function showClickRing(clientX, clientY) {
      const ring = document.createElement("div");
      ring.className = "click-ring";
      ring.style.left = clientX + "px";
      ring.style.top = clientY + "px";
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 500);
    }
  </script>
</body>
</html>
